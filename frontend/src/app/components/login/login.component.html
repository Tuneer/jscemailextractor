<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <h2>Email Extractor</h2>
      </div>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to continue</p>
    </div>
    
    <div class="login-body">
      <!-- Step 1: Email -->
      <div class="form-step" *ngIf="step === 'email'">
        <div class="form-group">
          <label for="email">Email or Username</label>
          <input
            type="email"
            id="email"
            class="input-field"
            [(ngModel)]="email"
            placeholder="Enter your email address"
            [disabled]="loading"
            (keyup.enter)="continueWithEmail()"
          >
        </div>
        
        <button
          class="btn btn-primary"
          [disabled]="loading || !email"
          (click)="continueWithEmail()"
        >
          <span class="loading-spinner" *ngIf="loading"></span>
          {{ loading ? 'Checking...' : 'Continue' }}
        </button>
      </div>
      
      <!-- Step 2: Authentication -->
      <div class="form-step" *ngIf="step === 'auth'">
        <!-- Login Mode Toggle -->
        <div class="login-mode-toggle">
          <button 
            class="toggle-btn" 
            [class.active]="loginMode === 'otp'"
            (click)="toggleLoginMode()"
            type="button">
            Login with OTP
          </button>
          <button 
            class="toggle-btn" 
            [class.active]="loginMode === 'password'"
            (click)="toggleLoginMode()"
            type="button">
            Login with Password
          </button>
        </div>
        
        <!-- New User Info -->
        <div class="info-box" *ngIf="isNewUser && loginMode === 'otp'">
          <p><strong>New User?</strong> Register by entering the OTP sent to your email.</p>
        </div>
        
        <!-- OTP Form -->
        <div *ngIf="loginMode === 'otp'">
          <!-- Send OTP Button First -->
          <button
            class="btn btn-secondary btn-block"
            [disabled]="loading"
            (click)="requestOTP()"
            type="button"
          >
            Send OTP
          </button>
          
          <!-- OTP Input After Sending -->
          <div class="form-group">
            <label for="otp">OTP Code</label>
            <input
              type="text"
              id="otp"
              class="input-field otp-input"
              [(ngModel)]="otp"
              placeholder="Enter 6-digit OTP"
              [disabled]="loading"
              maxlength="6"
              (keyup.enter)="verifyOTP()"
            >
          </div>
          
          <button
            class="btn btn-primary"
            [disabled]="loading || otp.length < 6"
            (click)="verifyOTP()"
          >
            <span class="loading-spinner" *ngIf="loading"></span>
            {{ loading ? 'Verifying...' : 'Login' }}
          </button>
        </div>
        
        <!-- Password Form -->
        <div *ngIf="loginMode === 'password'">
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              class="input-field"
              [(ngModel)]="password"
              placeholder="Enter your password"
              [disabled]="loading"
              (keyup.enter)="loginWithPassword()"
            >
          </div>
          
          <button
            class="btn btn-primary"
            [disabled]="loading || password.length < 6"
            (click)="loginWithPassword()"
          >
            <span class="loading-spinner" *ngIf="loading"></span>
            {{ loading ? 'Logging in...' : 'Login' }}
          </button>
        </div>
        
        <button
          class="btn btn-link"
          [disabled]="loading"
          (click)="backToEmail()"
          type="button"
        >
          ← Change Email/Username
        </button>
      </div>
      
      <!-- Message -->
      <div class="message" [class]="'message-' + messageType" *ngIf="message">
        <span class="message-icon">
          <span *ngIf="messageType === 'success'">✅</span>
          <span *ngIf="messageType === 'error'">❌</span>
          <span *ngIf="messageType === 'info'">ℹ️</span>
        </span>
        {{ message }}
      </div>
    </div>
    
    <div class="login-footer">
      <p>
        Don't have an account? 
        <a routerLink="/register" class="link-button">Register here</a>
      </p>
      <p class="company-name">JSC Global Solutions PVT. LTD.</p>
    </div>
  </div>
</div>
