<div class="register-container">
  <div class="register-card">
    <div class="register-header">
      <div class="logo">
        <h2>Email Extractor</h2>
      </div>
      <h1>Create Account</h1>
      <p class="subtitle">Register with verification</p>
    </div>

    <div class="register-body">
      <!-- Registration Form -->
      <div *ngIf="step === 'register'" class="form-step">
        <div class="form-group">
          <label for="username">Username *</label>
          <input 
            type="text" 
            id="username" 
            [(ngModel)]="username" 
            placeholder="Choose a username"
            [disabled]="loading"
            class="input-field"
          />
        </div>

        <div class="form-group">
          <label for="fullName">Full Name *</label>
          <input 
            type="text" 
            id="fullName" 
            [(ngModel)]="fullName" 
            placeholder="Enter your full name"
            [disabled]="loading"
            class="input-field"
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            placeholder="Enter your email"
            [disabled]="loading"
            (keyup.enter)="sendOTP()"
            class="input-field"
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input 
            type="tel" 
            id="phone" 
            [(ngModel)]="phone" 
            placeholder="Enter phone number (optional)"
            [disabled]="loading"
            class="input-field"
          />
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            placeholder="Create password (min 6 characters)"
            [disabled]="loading"
            class="input-field"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password *</label>
          <input 
            type="password" 
            id="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            placeholder="Confirm your password"
            [disabled]="loading"
            (keyup.enter)="sendOTP()"
            class="input-field"
          />
        </div>

        <button 
          class="btn btn-primary" 
          (click)="sendOTP()"
          [disabled]="loading || !username || !email || !fullName || !password || !confirmPassword"
        >
          <span *ngIf="!loading">Send OTP</span>
          <span *ngIf="loading" class="loading-spinner"></span>
        </button>

        <p class="info-text">
          We'll send OTP to verify your email
        </p>
      </div>

      <!-- OTP Verification -->
      <div *ngIf="step === 'otp'" class="form-step">
        <div class="otp-info">
          <p>OTP sent to <strong>{{ email }}</strong></p>
          <button class="link-button" (click)="backToRegister()">Change email</button>
        </div>

        <div class="form-group">
          <label for="otp">Enter OTP *</label>
          <input 
            type="text" 
            id="otp" 
            [(ngModel)]="otp" 
            placeholder="000000"
            maxlength="6"
            [disabled]="loading"
            (keyup.enter)="verifyAndRegister()"
            class="input-field otp-input"
          />
        </div>

        <button 
          class="btn btn-secondary" 
          (click)="sendOTP()"
          [disabled]="loading"
        >
          Resend OTP
        </button>

        <button 
          class="btn btn-primary" 
          (click)="verifyAndRegister()"
          [disabled]="loading || otp.length < 6"
        >
          <span *ngIf="!loading">Verify & Register</span>
          <span *ngIf="loading" class="loading-spinner"></span>
        </button>
      </div>

      <!-- Message Display -->
      <div *ngIf="message" class="message" [class]="'message-' + messageType">
        <span class="message-icon">
          <span *ngIf="messageType === 'success'">✓</span>
          <span *ngIf="messageType === 'error'">✗</span>
          <span *ngIf="messageType === 'info'">ℹ</span>
        </span>
        {{ message }}
      </div>
    </div>

    <div class="register-footer">
      <p>Already have an account? <a [routerLink]="['/login']" class="link-button">Login</a></p>
      <p class="company-name">JSC Global Solutions PVT. LTD.</p>
    </div>
  </div>
</div>
